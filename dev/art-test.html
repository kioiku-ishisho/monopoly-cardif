<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 美術測試</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-bottom: 1px solid #ccc; }
    .bar button, .bar select { font: inherit; min-height: 36px; }
    canvas { width: 100%; height: 100%; display: block; }
    #out { font-family: monospace; font-size: 12px; align-self: center; }
  </style>
</head>
<body>
  <!-- 開發用：檢查 js/art/ 的角色、主題、潘洛斯階梯（不會部署，見 .vercelignore） -->
  <div class="bar">
    <select id="key"></select>
    <button type="button" data-mode="light">淺色</button>
    <button type="button" data-mode="dark">深色</button>
    <button type="button" id="step">前進 6</button>
    <button type="button" id="laps">走兩圈</button>
    <button type="button" id="all">整圈</button>
    <button type="button" id="iso">潘洛斯視角</button>
    <button type="button" id="off">轉開視角</button>
    <button type="button" id="cycle">切換主題 50 次</button>
    <span id="out"></span>
  </div>
  <canvas id="c"></canvas>
  <script src="../vendor/three.min.js"></script>
  <script src="../js/art/core.js"></script>
  <script src="../js/art/data.js"></script>
  <script src="../js/art/characters.js"></script>
  <script src="../js/art/themes.js"></script>
  <script src="../js/art/board.js"></script>
  <script>
    const A = RealLifeArt;
    const types = ['起點', '機會', '命運', '保險業務員', '住院', '休息', '保單健檢', '保單整理日'];
    const tiles = Array.from({ length: 60 }, (_, i) => ({ label: i === 0 ? '起點' : types[1 + (i % 7)], tone: i === 0 || i % 7 === 2 ? 'C' : i % 2 ? 'B' : 'A' }));
    const art = (window.art = A.create(document.getElementById('c'), { character: 'doctor', mode: 'light', tiles }));
    const out = document.getElementById('out');
    const show = () => { const i = art.info(); out.textContent = `idx ${i.idx} laps ${i.laps} calls ${i.calls} tris ${i.triangles} geo ${i.geometries} tex ${i.textures}`; };
    setInterval(show, 500);
    const sel = document.getElementById('key');
    sel.innerHTML = A.ORDER.map((k) => `<option value="${k}">${A.PRO[k].name}・${A.THEME_NAMES[k]}</option>`).join('');
    sel.onchange = () => art.setCharacter(sel.value);
    document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => art.setMode(b.dataset.mode)));
    document.getElementById('step').onclick = () => art.moveTo(art.getTokenIndex() + 6);
    document.getElementById('laps').onclick = async () => {
      const start = art.getLaps();
      for (let k = 0; k < 120; k++) await art.moveTo(art.getTokenIndex() + 1, { hopMs: 30 });
      out.textContent = `兩圈完成：laps +${art.getLaps() - start}, idx ${art.getTokenIndex()}`;
    };
    document.getElementById('all').onclick = () => art.setOverview(!art.isOverview());
    document.getElementById('iso').onclick = () => art.setAngles();
    document.getElementById('off').onclick = () => art.setAngles(50, 20);
    document.getElementById('cycle').onclick = () => {
      for (let k = 0; k < 50; k++) { art.setCharacter(A.ORDER[k % 10]); art.setMode(k % 2 ? 'dark' : 'light'); art.render(); }
    };
  </script>
</body>
</html>
