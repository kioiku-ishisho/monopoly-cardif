<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>現實人生｜遊戲中</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('lf.settings') || '{}');
      var t = s.theme || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="page-game">
  <a class="skip-link" href="#btn-dice">跳到擲骰子按鈕</a>
  <h1 class="sr-only">現實人生 遊戲畫面</h1>

  <header class="game-top">
    <button class="pause-btn" type="button" id="btn-pause" data-icon="pause" aria-label="暫停"></button>
    <!-- 上列狀態列：現金／健康／幸福只顯示在這裡，「個人」分頁不重複 -->
    <div class="status-bar" id="status-bar" role="group" aria-label="目前狀態">
      <p class="stage-chip" id="stage-chip" aria-live="polite"></p>
      <p class="stat stat-cash">
        <span class="stat-label">現金</span>
        <strong class="stat-value" id="sum-cash"></strong>
      </p>
      <p class="stat-row">
        <span class="stat stat-meter">
          <span class="stat-label">健康</span>
          <span class="stat-value" id="sum-health"></span>
          <span class="meter" id="sum-health-meter" aria-hidden="true"><span></span></span>
        </span>
        <span class="stat stat-meter">
          <span class="stat-label">幸福</span>
          <span class="stat-value" id="sum-happiness"></span>
          <span class="meter happy" id="sum-happiness-meter" aria-hidden="true"><span></span></span>
        </span>
      </p>
    </div>
  </header>

  <div class="game-sub">
    <p class="perk-chip" id="perk-chip" role="status" hidden></p>
    <!-- 最新一次市場波動，一直顯示到下一回合更新 -->
    <button class="market-ticker" type="button" id="market-ticker" aria-describedby="market-ticker-hint">
      <span class="ticker-icon" id="ticker-icon" aria-hidden="true">🏦</span>
      <span class="ticker-text" id="ticker-text" role="status" aria-live="polite">市場尚未開盤，擲骰子後更新</span>
      <span class="ticker-meta" id="ticker-meta"></span>
    </button>
    <span class="sr-only" id="market-ticker-hint">開啟市場波動紀錄</span>
  </div>

  <main class="game-main">
    <!-- 地圖與棋子：有 WebGL 時顯示 3D 潘洛斯階梯（js/art/），否則沿用 SVG 地圖；格子清單保留給螢幕閱讀器 -->
    <div class="board-viewport" id="board-viewport" tabindex="0" role="region"
         aria-roledescription="地圖" aria-label="大富翁地圖" aria-describedby="map-help">
      <canvas class="board-3d" id="board-3d" aria-hidden="true"></canvas>
      <div class="board" id="board">
        <svg class="roads" id="roads" aria-hidden="true" focusable="false"></svg>
        <div class="loops" id="loops"></div>
        <div class="token" id="token" aria-hidden="true"></div>
      </div>
    </div>
    <p class="sr-only" id="map-help">可拖曳移動地圖、滾輪或雙指縮放。鍵盤操作：方向鍵移動，加號與減號縮放，0 或 9 顯示整圈。</p>

    <div class="map-controls" role="group" aria-label="地圖視角">
      <button class="icon-btn solid" type="button" id="btn-zoom-in" data-icon="plus" aria-label="放大地圖"></button>
      <button class="icon-btn solid" type="button" id="btn-zoom-out" data-icon="minus" aria-label="縮小地圖"></button>
      <button class="icon-btn solid" type="button" id="btn-zoom-me" data-icon="target" aria-label="以我的位置為中心"></button>
      <button class="icon-btn solid" type="button" id="btn-zoom-all" data-icon="layers" aria-label="顯示整圈"></button>
    </div>
  </main>

  <div class="dice-area">
    <p class="dice-result" id="dice-result" aria-live="polite"></p>
    <button class="dice-btn" type="button" id="btn-dice" aria-describedby="dice-result">
      <span class="dice-face" id="dice-face" aria-hidden="true">🎲</span>
      <span class="dice-label">擲骰子</span>
    </button>
  </div>

  <!-- 右側面板：電腦版常駐（上方分頁列）；手機為右緣直立分頁＋抽屜（js/game/panels.js） -->
  <aside class="side-panel" id="side-panel" aria-label="遊戲資訊">
    <div class="tab-list" role="tablist" aria-label="遊戲資訊分頁">
      <button class="tab" type="button" role="tab" id="btn-policy" data-tab="insurance" aria-controls="panel-insurance" aria-selected="false">保險</button>
      <button class="tab" type="button" role="tab" id="btn-stock" data-tab="stock" aria-controls="panel-stock" aria-selected="false">股票</button>
      <button class="tab" type="button" role="tab" id="btn-history" data-tab="history" aria-controls="panel-history" aria-selected="false">歷史</button>
      <button class="tab" type="button" role="tab" id="btn-personal" data-tab="personal" aria-controls="panel-personal" aria-selected="true">個人</button>
    </div>
    <div class="tab-panels" id="tab-panels">
      <section class="tab-panel" id="panel-insurance" role="tabpanel" aria-labelledby="btn-policy" hidden>
        <h2 class="panel-title">保險</h2>
        <div id="policy-body"></div>
      </section>
      <section class="tab-panel" id="panel-stock" role="tabpanel" aria-labelledby="btn-stock" hidden>
        <h2 class="panel-title">股票</h2>
        <div id="stock-body"></div>
      </section>
      <section class="tab-panel" id="panel-history" role="tabpanel" aria-labelledby="btn-history" hidden>
        <h2 class="panel-title">歷史事件</h2>
        <div class="tabs" role="group" aria-label="篩選事件">
          <button class="btn btn-sm btn-ghost" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="btn btn-sm btn-ghost" type="button" data-filter="market" aria-pressed="false">市場波動</button>
          <button class="btn btn-sm btn-ghost" type="button" data-filter="life" aria-pressed="false">人生事件</button>
        </div>
        <ol class="event-list" id="event-list"></ol>
      </section>
      <section class="tab-panel" id="panel-personal" role="tabpanel" aria-labelledby="btn-personal">
        <h2 class="panel-title">個人</h2>
        <div id="personal-body"></div>
      </section>
    </div>
  </aside>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>

  <!-- 保單與保險規則：保險業務員格疊在對話視窗上開啟（平時用右側「保險」分頁） -->
  <dialog class="modal modal-wide" id="dlg-policy" aria-labelledby="dlg-policy-title">
    <div class="modal-head">
      <h2 id="dlg-policy-title">保險</h2>
      <button class="icon-btn" type="button" data-close data-icon="close" aria-label="關閉"></button>
    </div>
    <div class="modal-body">
      <div id="policy-dlg-body"></div>
    </div>
  </dialog>

  <!-- 保險建議書：在遊戲頁內開啟，不離開這一頁（遊戲狀態只存在記憶體，換頁會重新開局） -->
  <dialog class="proposal-dlg" id="dlg-proposal" aria-label="保險建議書">
    <iframe class="proposal-frame" id="proposal-frame" title="保險建議書"></iframe>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/insurance.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/seminar.js"></script>
  <script src="js/events.js"></script>
  <script src="js/review.js"></script>
  <script src="js/world.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/game/core.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="js/art/core.js"></script>
  <script src="js/art/data.js"></script>
  <script src="js/art/characters.js"></script>
  <script src="js/art/themes.js"></script>
  <script src="js/art/board.js"></script>
  <script src="js/game/map.js"></script>
  <script src="js/game/panels.js"></script>
  <script src="js/game/policies.js"></script>
  <script src="js/game/market.js"></script>
  <script src="js/game/context.js"></script>
  <script src="js/game/report.js"></script>
  <script src="js/game/turn.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
