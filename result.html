<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>人生富翁｜人生結算</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('lf.settings') || '{}');
      var t = s.theme || 'system';
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body class="page-result">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <main id="main" class="result" aria-busy="true">
    <header class="result-head">
      <h1>人生結算</h1>
      <p class="result-meta" id="result-meta"></p>
    </header>

    <div id="loading" class="loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>AI 正在分析你的人生…<br><small>約需 20～60 秒</small></p>
    </div>

    <div id="content" hidden>
      <div class="top-cards">
        <section class="card score-card" aria-labelledby="score-title">
          <h2 id="score-title">AI 評分</h2>
          <div class="score-ring" id="score-ring" role="img">
            <div class="score-inner">
              <span class="score-num" id="score-num"></span>
              <span class="score-grade" id="score-grade"></span>
            </div>
          </div>
          <p class="score-source" id="score-source"></p>
        </section>

        <section class="card rank-card" aria-labelledby="rank-title">
          <h2 id="rank-title">全服排名</h2>
          <p class="rank-big" id="rank-big"></p>
          <p class="rank-sub" id="rank-sub"></p>
          <p class="rank-note" id="rank-note"></p>
          <button class="btn btn-ghost btn-sm rank-btn" type="button" id="btn-leaderboard" data-icon="trophy">查看全服排行榜</button>
        </section>
      </div>

      <section class="card" aria-labelledby="breakdown-title">
        <h2 id="breakdown-title">計分明細</h2>
        <p class="breakdown-note">滿分 100，不計入剩餘資產：活得久、過得幸福健康、做好保險與理財決策才是高分關鍵。</p>
        <ul class="breakdown-list" id="breakdown-list"></ul>
      </section>

      <section class="card" aria-labelledby="stats-title">
        <h2 id="stats-title">人生數據</h2>
        <dl class="stat-grid" id="stat-grid"></dl>
      </section>

      <section class="card" aria-labelledby="summary-title">
        <h2 id="summary-title">AI 遊戲總結</h2>
        <p id="summary"></p>
      </section>

      <section class="card" aria-labelledby="decision-title">
        <h2 id="decision-title">AI 決策回顧</h2>
        <ul class="decision-list" id="decision-list"></ul>
      </section>

      <section class="card" aria-labelledby="advice-title">
        <h2 id="advice-title">AI 理財建議</h2>
        <ol class="advice-list" id="advice-list"></ol>
        <p class="unlock-note" id="unlock-note" aria-live="polite"></p>
      </section>
    </div>

    <div id="empty" class="card empty-state" hidden>
      <p>找不到本局的遊戲結果，可能已經看過或尚未完成遊戲。</p>
    </div>

    <div class="home-wrap">
      <a class="btn btn-primary btn-lg" href="index.html" data-icon="home">回到主頁</a>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/score.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
